<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tabBoxShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>

    <!-- 盒子正面渐变 -->
    <linearGradient id="tBoxGrad" x1="20" y1="58" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 盒子内壁阴影 -->
    <linearGradient id="tBoxInnerGrad" x1="24" y1="46" x2="104" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- 标签 1: 科技深蓝 -->
    <linearGradient id="tCardBlue" x1="26" y1="20" x2="80" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 标签 2: 鲜亮青绿 -->
    <linearGradient id="tCardCyan" x1="38" y1="24" x2="92" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 标签 3: 活力金黄 (PageBox 经典文件夹黄色) -->
    <linearGradient id="tCardGold" x1="48" y1="30" x2="102" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <g filter="url(#tabBoxShadow)">
    <!-- 后层标签卡片 1 (左倾) -->
    <g transform="rotate(-9 48 48)">
      <rect x="22" y="16" width="54" height="42" rx="7" fill="url(#tCardBlue)" />
      <circle cx="30" cy="23" r="2.2" fill="#93C5FD" />
      <rect x="37" y="21.5" width="22" height="3" rx="1.5" fill="#BFDBFE" opacity="0.85" />
    </g>

    <!-- 中层标签卡片 2 (微正) -->
    <g transform="rotate(2 64 48)">
      <rect x="36" y="18" width="56" height="42" rx="7" fill="url(#tCardCyan)" />
      <circle cx="45" cy="25" r="2.2" fill="#A5F3FC" />
      <rect x="52" y="23.5" width="24" height="3" rx="1.5" fill="#E0F2FE" opacity="0.9" />
    </g>

    <!-- 前层标签卡片 3 (右倾金黄) -->
    <g transform="rotate(11 76 52)">
      <rect x="46" y="22" width="58" height="44" rx="7" fill="url(#tCardGold)" />
      <circle cx="55" cy="29" r="2.2" fill="#FEF3C7" />
      <rect x="62" y="27.5" width="26" height="3" rx="1.5" fill="#FFFBEB" opacity="0.95" />
    </g>

    <!-- 收纳盒内口深色槽 -->
    <path
      d="M20 54C20 50.7 22.7 48 26 48H102C105.3 48 108 50.7 108 54V62H20V54Z"
      fill="url(#tBoxInnerGrad)"
    />

    <!-- 收纳盒前景外壳 -->
    <path
      d="M18 58C18 54.7 20.7 52 24 52H104C107.3 52 110 54.7 110 58V96C110 102.6 104.6 108 98 108H30C23.4 108 18 102.6 18 96V58Z"
      fill="url(#tBoxGrad)"
    />

    <!-- 顶部翻沿明亮高光边 -->
    <path
      d="M18 58C18 54.7 20.7 52 24 52H104C107.3 52 110 54.7 110 58V62H18V58Z"
      fill="#3B82F6"
    />
    <line x1="24" y1="53" x2="104" y2="53" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" />

    <!-- 盒体中央：极简字母 P 品牌标识 -->
    <rect x="52" y="72" width="24" height="24" rx="6" fill="#1E3A8A" opacity="0.4" />
    <path
      d="M60 78H67C68.7 78 70 79.3 70 81C70 82.7 68.7 84 67 84H60V90"
      stroke="#FFFFFF"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>