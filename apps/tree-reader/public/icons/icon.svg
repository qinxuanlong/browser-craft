<svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景圆角底座渐变 -->
    <linearGradient id="bgGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- 树冠翠绿渐变 -->
    <linearGradient id="treeGrad" x1="64" y1="20" x2="64" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 书本亮色渐变 -->
    <linearGradient id="bookGrad" x1="24" y1="68" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- 书页阴影 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 图标底座 (现代圆角图标) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" stroke="#334155" stroke-opacity="0.4" />

  <g filter="url(#softGlow)">
    <!-- 翻开的书本底座 (Open Book) -->
    <!-- 左书页 -->
    <path
      d="M26 88C36 82 48 83 62 86V62C48 59 36 58 26 64V88Z"
      fill="url(#bookGrad)"
      opacity="0.95"
    />
    <!-- 右书页 -->
    <path
      d="M102 88C92 82 80 83 66 86V62C80 59 92 58 102 64V88Z"
      fill="url(#bookGrad)"
      opacity="0.95"
    />
    <!-- 书本中缝与厚度 -->
    <path
      d="M62 86C63.3 86.5 64.7 86.5 66 86V91C64.7 91.5 63.3 91.5 62 91V86Z"
      fill="#059669"
    />
    <path
      d="M26 88C36 84 48 85 62 88V91C48 88 36 87 26 91V88Z"
      fill="#047857"
      opacity="0.6"
    />
    <path
      d="M102 88C92 84 80 85 66 88V91C80 88 92 87 102 91V88Z"
      fill="#047857"
      opacity="0.6"
    />

    <!-- 书页上的目录树逻辑节点线条 (象征结构化目录) -->
    <path d="M35 73H44V78H52" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="35" cy="73" r="2.2" fill="#059669" />
    <circle cx="52" cy="78" r="2.2" fill="#10B981" />

    <path d="M93 73H84V78H76" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="93" cy="73" r="2.2" fill="#059669" />
    <circle cx="76" cy="78" r="2.2" fill="#10B981" />

    <!-- 树干与生长主干 -->
    <path
      d="M61 86C61 74 62 58 62 48H66C66 58 67 74 67 86H61Z"
      fill="url(#treeGrad)"
    />

    <!-- 树枝分支与树冠节点 -->
    <!-- 中间主枝叶 -->
    <path d="M64 48V26" stroke="url(#treeGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M64 22C61 26 61 31 64 34C67 31 67 26 64 22Z" fill="#34D399" />

    <!-- 左侧分支 -->
    <path d="M63 52C55 48 47 43 42 35" stroke="url(#treeGrad)" stroke-width="2.6" stroke-linecap="round" />
    <path d="M54 47C50 40 48 35 48 29" stroke="url(#treeGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M40 33C37 36 38 41 42 43C45 41 45 36 40 33Z" fill="#34D399" />
    <path d="M48 27C45 30 46 34 49 36C52 34 52 30 48 27Z" fill="#6EE7B7" />
    <circle cx="55" cy="48" r="2" fill="#A7F3D0" />

    <!-- 右侧分支 -->
    <path d="M65 52C73 48 81 43 86 35" stroke="url(#treeGrad)" stroke-width="2.6" stroke-linecap="round" />
    <path d="M74 47C78 40 80 35 80 29" stroke="url(#treeGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M88 33C91 36 90 41 86 43C83 41 83 36 88 33Z" fill="#34D399" />
    <path d="M80 27C83 30 82 34 79 36C76 34 76 30 80 27Z" fill="#6EE7B7" />
    <circle cx="73" cy="48" r="2" fill="#A7F3D0" />
  </g>
</svg>