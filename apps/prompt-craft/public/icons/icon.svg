<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：从电光紫蓝到活力洋红 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- 闪电/符号金黄高亮渐变 -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- 霓虹青蓝光泽 -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 圆角外框 -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- 内部光效环 -->
  <rect x="8" y="8" width="112" height="56" rx="26" fill="white" opacity="0.08" />

  <!-- 核心图形：智能指令终端符号与灵感闪电交汇 -->
  <g filter="url(#softGlow)">
    <!-- 命令行尖括号 > -->
    <path d="M 32 40 L 56 64 L 32 88" fill="none" stroke="url(#neonGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 灵感闪电 ⚡ -->
    <path d="M 74 28 L 56 62 L 72 62 L 62 100 L 92 56 L 76 56 Z" fill="url(#sparkGrad)" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" />

    <!-- 灵感火花星芒 -->
    <circle cx="94" cy="34" r="4" fill="#ffffff" opacity="0.9" />
    <path d="M 94 26 L 94 42 M 86 34 L 102 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>